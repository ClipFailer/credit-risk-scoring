project:
  name: "credit-risk-scoring"
  random_state: 42

data:
  raw_path: "data/raw/credit_scoring.csv"
  processed_train_path: "data/processed/train.parquet"
  processed_test_path: "data/processed/test.parquet"
  target_column: "SeriousDlqin2yrs"
  test_size: 0.2
  n_splits: 5

features:
  numerical_cols:
    - "RevolvingUtilizationOfUnsecuredLines"
    - "age"
    - "NumberOfTime30-59DaysPastDueNotWorse"
    - "DebtRatio"
    - "MonthlyIncome"
    - "NumberOfOpenCreditLinesAndLoans"
    - "NumberOfTimes90DaysLate"
    - "NumberRealEstateLoansOrLines"
    - "NumberOfTime60-89DaysPastDueNotWorse"
    - "NumberOfDependents"

business:
  score_min: 300
  score_max: 850
  cost_false_positive: 1.0  # Упущенная выгода от отказа хорошему клиенту
  cost_false_negative: 8.0  # Убыток от выдачи кредита дефолтному клиенту (в 8 раз выше)
  default_threshold: 0.5

model:
  output_dir: "models"
  model_filename: "best_model.joblib"
